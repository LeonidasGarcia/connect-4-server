asyncapi: 3.1.0
info:
  title: Connect 4 Game Server
  version: 1.1.0
  description: WebSocket server for Connect 4 multiplayer game. Single room, max 2 players. Server validates silently (invalid requests are ignored). The server owns turn validation, gravity, win detection, and scoring. Player disconnection resets the game.

servers:
  development:
    host: localhost:3000
    protocol: socket.io
    description: Development server

channels:
  gameRoom:
    address: /
    title: Game Room
    description: Main channel for Connect 4 game communication
    messages:
      joinRoom:
        $ref: '#/components/messages/JoinRoom'
      makeMove:
        $ref: '#/components/messages/MakeMove'
      playerIdAssigned:
        $ref: '#/components/messages/PlayerIdAssigned'
      gameStateChanged:
        $ref: '#/components/messages/GameStateChanged'
      errorOccurred:
        $ref: '#/components/messages/ErrorOccurred'

operations:
  sendJoinRoom:
    action: send
    channel:
      $ref: '#/channels/gameRoom'
    messages:
      - $ref: '#/channels/gameRoom/messages/joinRoom'

  sendMakeMove:
    action: send
    channel:
      $ref: '#/channels/gameRoom'
    messages:
      - $ref: '#/channels/gameRoom/messages/makeMove'

  receivePlayerIdAssigned:
    action: receive
    channel:
      $ref: '#/channels/gameRoom'
    messages:
      - $ref: '#/channels/gameRoom/messages/playerIdAssigned'

  receiveGameStateChanged:
    action: receive
    channel:
      $ref: '#/channels/gameRoom'
    messages:
      - $ref: '#/channels/gameRoom/messages/gameStateChanged'

  receiveErrorOccurred:
    action: receive
    channel:
      $ref: '#/channels/gameRoom'
    messages:
      - $ref: '#/channels/gameRoom/messages/errorOccurred'

components:
  messages:
    JoinRoom:
      name: joinRoom
      title: Join Room
      description: Request to join the game room
      payload:
        $ref: '#/components/schemas/JoinRoomPayload'

    MakeMove:
      name: makeMove
      title: Make Move
      description: Place a token in a column. Invalid payloads are silently ignored. The server applies gravity and validates turns.
      payload:
        $ref: '#/components/schemas/MakeMovePayload'

    PlayerIdAssigned:
      name: playerIdAssigned
      title: Player ID Assigned
      description: Sent when a player connects and receives their unique ID
      payload:
        $ref: '#/components/schemas/PlayerIdAssignedPayload'

    GameStateChanged:
      name: gameStateChanged
      title: Game State Changed
      description: Broadcasted when game state updates
      payload:
        $ref: '#/components/schemas/GameStateChangedPayload'

    ErrorOccurred:
      name: errorOccurred
      title: Error Occurred
      description: Error notification from server
      payload:
        $ref: '#/components/schemas/ErrorOccurredPayload'

  schemas:
    JoinRoomPayload:
      type: object
      additionalProperties: false
      properties:
        roomId:
          type: string
          description: Room identifier (ignored in single-room mode)

    MakeMovePayload:
      type: object
      additionalProperties: false
      properties:
        col:
          type: integer
          minimum: 0
          maximum: 6
          description: Column index where the token is dropped
      required:
        - col

    PlayerIdAssignedPayload:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description: Unique player identifier assigned by the server

    GameStateChangedPayload:
      type: object
      additionalProperties: false
      properties:
        players:
          type: array
          items:
            $ref: '#/components/schemas/Player'
          description: List of players in the room (max 2)
        currentPlayerId:
          type: string
          description: ID of the player whose turn it is
        scores:
          type: object
          additionalProperties:
            type: integer
          description: Score for each player
        tokens:
          $ref: '#/components/schemas/Tokens'
          description: Token coordinates grouped by player. Coordinates use the "col,row" format.
      required:
        - players
        - currentPlayerId
        - scores
        - tokens

    Tokens:
      type: object
      additionalProperties: false
      properties:
        player1:
          type: array
          items:
            type: string
            pattern: '^[0-6],[0-5]$'
          description: Coordinates occupied by player 1 tokens
        player2:
          type: array
          items:
            type: string
            pattern: '^[0-6],[0-5]$'
          description: Coordinates occupied by player 2 tokens
      required:
        - player1
        - player2

    ErrorOccurredPayload:
      type: object
      additionalProperties: false
      properties:
        message:
          type: string
          description: Error message description

    Player:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description: Player unique identifier
        color:
          type: string
          description: Player token color in hex format
        name:
          type: string
          description: Player display name
      required:
        - id
        - color
        - name
